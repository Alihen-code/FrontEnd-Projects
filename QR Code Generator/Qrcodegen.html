 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 20px;
  }
  h1 { font-size: 20px; margin: 0; }
  .box {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  input {
    width: 260px;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  button {
    padding: 10px 16px;
    font-size: 15px;
    border: 0;
    border-radius: 8px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
  #qrcode img, #qrcode canvas { display: block; }
</style>
</head>
<body>

  <h1>QR Code Generator</h1>

  <div class="box">
    <input id="text" type="text" placeholder="Type something..." value="https://example.com">
    <button id="generate">Generate</button>
    <div id="qrcode"></div>
    <button id="download" hidden>Download PNG</button>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <script>
    const input       = document.getElementById('text');
    const qrDiv       = document.getElementById('qrcode');
    const downloadBtn = document.getElementById('download');

    function generate() {
      const text = input.value.trim();
      if (!text) return;

      qrDiv.innerHTML = ''; // clear the old one
      new QRCode(qrDiv, {
        text: text,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.M
      });

      downloadBtn.hidden = false;
    }

    document.getElementById('generate').onclick = generate;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

    downloadBtn.onclick = () => {
      const canvas = qrDiv.querySelector('canvas');
      if (!canvas) return;
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'qrcode.png';
      a.click();
    };

    generate(); // draw one on page load
  </script>

</body>
</html>
