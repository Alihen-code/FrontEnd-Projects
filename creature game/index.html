  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RPG Creature Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🧙 RPG Creature Search</h1>

    <!-- Search -->
    <input
      id="search-input"
      type="text"
      placeholder="Enter creature name or ID"
      required
    />
    <button id="search-button">Search</button>

    <!-- Creature Info -->
    <div class="card">
      <h2 id="creature-name"></h2>
      <p id="creature-id"></p>
      <p id="weight"></p>
      <p id="height"></p>

      <div id="types"></div>

      <!-- Stats -->
      <div class="stats">
        <p>HP: <span id="hp"></span></p>
        <p>Attack: <span id="attack"></span></p>
        <p>Defense: <span id="defense"></span></p>
        <p>Special Attack: <span id="special-attack"></span></p>
        <p>Special Defense: <span id="special-defense"></span></p>
        <p>Speed: <span id="speed"></span></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
