 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Encryption</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 20px;
  }
  h1 { font-size: 20px; margin: 0; }
  .box {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 320px;
  }
  textarea {
    width: 100%;
    height: 80px;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-family: inherit;
  }
  #output {
    width: 100%;
    min-height: 80px;
    padding: 10px 12px;
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: monospace;
    font-size: 14px;
    word-break: break-all;
    white-space: pre-wrap;
    text-align: left;
  }
  button {
    padding: 10px 16px;
    font-size: 15px;
    border: 0;
    border-radius: 8px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
</style>
</head>
<body>

  <h1>Text Encryption</h1>

  <div class="box">
    <textarea id="input" placeholder="Type your text here...">Hello World</textarea>
    <button id="encryptBtn">Encrypt</button>
    <div id="output"></div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const encryptBtn = document.getElementById('encryptBtn');

    // Simple Caesar cipher (shift 3)
    function caesarCipher(str, shift) {
      return str.replace(/[a-zA-Z]/g, function(c) {
        const base = c <= 'Z' ? 65 : 97;
        return String.fromCharCode((c.charCodeAt(0) - base + shift) % 26 + base);
      });
    }

    function encrypt() {
      const text = input.value;
      const encrypted = caesarCipher(text, 3);
      output.textContent = encrypted;
    }

    // Live update as you type
    input.addEventListener('input', encrypt);
    // Also on button click
    encryptBtn.addEventListener('click', encrypt);

    // Initial encryption on page load
    encrypt();
  </script>

</body>
</html>
